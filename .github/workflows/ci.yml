# PureAir Life - Continuous Integration
#
# The same gate that has to pass locally (`npm run check`) is what CI runs:
# lint -> typecheck -> tests with coverage floors -> production build ->
# dist / i18n / catalogue audits.
#
# The workflow is deliberately a mirror of `npm run check` so a green pull
# request means exactly what a green local run means.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality-gate:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit the built bundle
        run: npm run audit:dist

      - name: Audit the translations
        run: npm run audit:i18n

      - name: Report the city catalogue
        run: npm run report:catalogue

  end-to-end:
    name: End-to-end journey (real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gate

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium build for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: npm run test:e2e

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high
